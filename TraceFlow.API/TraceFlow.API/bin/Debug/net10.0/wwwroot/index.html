<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TraceFlow Logistics Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
    <div class="max-w-4xl mx-auto space-y-6">

        <!-- Header -->
        <header class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center gap-3">
                <span class="text-3xl">📦</span>
                <h1 class="text-2xl font-bold tracking-wide">TraceFlow Logistics Center</h1>
            </div>
            <button onclick="openProductModal()" class="bg-emerald-600 hover:bg-emerald-500 transition-colors text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md flex items-center gap-2">
                <span>+</span> Add Product
            </button>
        </header>

        <!-- Warehouse Stock Section -->
        <section class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Warehouse Stock</h2>
            <div id="productsList" class="space-y-3">
                <p class="text-slate-400 animate-pulse">Loading inventory...</p>
            </div>
        </section>

        <!-- Shipment Trackers Section -->
        <section class="bg-slate-800/80 border border-slate-700/50 rounded-xl p-5 shadow-lg">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">Shipment Trackers</h2>
            <div id="shipmentsList" class="space-y-3">
                <p class="text-slate-400">No active orders...</p>
            </div>
        </section>

    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="hidden fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-md w-full shadow-2xl">
            <h3 id="modalTitle" class="text-xl font-bold mb-4">Add New Product</h3>
            <form id="productForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="productId">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">SKU</label>
                    <input type="text" id="sku" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 mb-1">Product Name</label>
                    <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Unit Price ($)</label>
                        <input type="number" step="0.01" id="unitPrice" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1">Initial Stock</label>
                        <input type="number" id="availableQuantity" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-100 focus:outline-none focus:border-blue-500">
                    </div>
                </div>
                <div class="flex justify-end gap-3 pt-2">
                    <button type="button" onclick="closeProductModal()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-lg text-sm font-semibold">Cancel</button>
                    <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-semibold shadow-md">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <script>
                // @ts-nocheck
                const API_BASE = "/api";
                let inventoryCache = [];

                function getStatusBadge(status) {
                    const statusMap = {
                        0: { label: 'Created', color: 'bg-slate-600 text-slate-200' },
                        1: { label: 'Pending', color: 'bg-amber-500/20 text-amber-400 border-amber-500/30' },
                        2: { label: 'Processing', color: 'bg-blue-500/20 text-blue-400 border-blue-500/30' },
                        3: { label: 'In-Transit', color: 'bg-indigo-500/20 text-indigo-400 border-indigo-500/30' },
                        4: { label: 'Delivered', color: 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' },
                        5: { label: 'Cancelled', color: 'bg-rose-500/20 text-rose-400 border-rose-500/30' }
                    };

                    const item = statusMap[status] || { label: `Status: ${status}`, color: 'bg-slate-600 text-slate-200' };
                    return `<span class="px-2 py-0.5 text-xs font-semibold rounded border ${item.color}">${item.label}</span>`;
                }

                async function loadData() {
                    try {
                        const resProducts = await fetch(`${API_BASE}/inventory`);
                        if (!resProducts.ok) throw new Error(`Inventory API HTTP ${resProducts.status}`);
                        inventoryCache = await resProducts.json();

                        const productsListEl = document.getElementById('productsList');
                        if (productsListEl) {
                            if (inventoryCache.length === 0) {
                                productsListEl.innerHTML = `<p class="text-slate-400">No inventory found.</p>`;
                            } else {
                                productsListEl.innerHTML = inventoryCache.map(p => `
                                    <div class="flex justify-between items-center bg-slate-700/50 border border-slate-600/40 p-3 rounded-lg">
                                        <div>
                                            <span class="font-bold text-amber-400 font-mono">${p.sku || p.SKU}</span>
                                            <span class="text-slate-300 mx-1">-</span>
                                            <span class="font-medium">${p.name || p.Name}</span>
                                            <span class="ml-2 text-xs text-slate-400 font-mono">(Stock: ${p.availableQuantity ?? p.AvailableQuantity})</span>
                                        </div>
                                        <div class="flex items-center gap-2">
                                            <button onclick="createOrder('${p.id || p.Id}')" class="bg-blue-600 hover:bg-blue-500 text-white px-2.5 py-1 rounded text-xs font-semibold">
                                                Fulfill 1
                                            </button>
                                            <button onclick="editProduct('${p.id || p.Id}')" class="bg-slate-600 hover:bg-slate-500 text-slate-200 px-2.5 py-1 rounded text-xs font-semibold">
                                                Edit
                                            </button>
                                            <button onclick="deleteProduct('${p.id || p.Id}')" class="bg-rose-600 hover:bg-rose-500 text-white px-2 py-1 rounded text-xs font-semibold">
                                                🗑️
                                            </button>
                                        </div>
                                    </div>
                                `).join('');
                            }
                        }

                        const resShipments = await fetch(`${API_BASE}/shipments`);
                        if (!resShipments.ok) throw new Error(`Shipments API HTTP ${resShipments.status}`);
                        const shipments = await resShipments.json();

                        const shipmentsListEl = document.getElementById('shipmentsList');
                        if (shipmentsListEl) {
                            if (shipments.length === 0) {
                                shipmentsListEl.innerHTML = `<p class="text-slate-400">No active orders...</p>`;
                            } else {
                                shipmentsListEl.innerHTML = shipments.map(s => {
                                    const statusVal = s.status ?? s.Status;
                                    return `
                                        <div class="flex justify-between items-center bg-slate-700/50 border border-slate-600/40 p-3 rounded-lg">
                                            <div class="flex items-center gap-3">
                                                <span class="font-mono text-emerald-400 font-semibold">${s.trackingNumber || s.TrackingNumber}</span>
                                                ${getStatusBadge(statusVal)}
                                            </div>
                                            ${statusVal !== 3 && statusVal !== 4 ? `
                                                <button onclick="dispatch('${s.id || s.Id}')" class="bg-amber-600 hover:bg-amber-500 text-white px-3 py-1 rounded-md text-xs font-semibold">
                                                    Set In-Transit
                                                </button>
                                            ` : ''}
                                        </div>
                                    `;
                                }).join('');
                            }
                        }
                    } catch (err) {
                        console.error("TraceFlow UI load error:", err);
                    }
                }

                function openProductModal(product = null) {
                    const form = document.getElementById('productForm');
                    if (form) form.reset();

                    if (product) {
                        document.getElementById('modalTitle').innerText = "Edit Product";
                        document.getElementById('productId').value = product.id || product.Id;
                        document.getElementById('sku').value = product.sku || product.SKU;
                        document.getElementById('name').value = product.name || product.Name;
                        document.getElementById('unitPrice').value = product.unitPrice || product.UnitPrice;
                        document.getElementById('availableQuantity').value = product.availableQuantity ?? product.AvailableQuantity;
                    } else {
                        document.getElementById('modalTitle').innerText = "Add New Product";
                        document.getElementById('productId').value = "";
                    }

                    document.getElementById('productModal').classList.remove('hidden');
                }

                function closeProductModal() {
                    document.getElementById('productModal').classList.add('hidden');
                }

                function editProduct(id) {
                    const product = inventoryCache.find(p => (p.id || p.Id) === id);
                    if (product) openProductModal(product);
                }

                async function handleFormSubmit(e) {
                    e.preventDefault();

                    const id = document.getElementById('productId').value;
                    const payload = {
                        sku: document.getElementById('sku').value,
                        name: document.getElementById('name').value,
                        unitPrice: parseFloat(document.getElementById('unitPrice').value),
                        availableQuantity: parseInt(document.getElementById('availableQuantity').value, 10)
                    };

                    const url = id ? `${API_BASE}/inventory/${id}` : `${API_BASE}/inventory`;
                    const method = id ? 'PUT' : 'POST';

                    try {
                        const res = await fetch(url, {
                            method: method,
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });

                        if (res.ok) {
                            closeProductModal();
                            await loadData();
                        } else {
                            alert("Operation failed. Check API connectivity.");
                        }
                    } catch (err) {
                        console.error("Error saving product:", err);
                    }
                }

                async function deleteProduct(id) {
                    if (!confirm("Are you sure you want to delete this product?")) return;
                    try {
                        const res = await fetch(`${API_BASE}/inventory/${id}`, { method: 'DELETE' });
                        if (res.ok) await loadData();
                    } catch (err) {
                        console.error("Error deleting product:", err);
                    }
                }

                async function createOrder(productId) {
                    try {
                        const res = await fetch(`${API_BASE}/shipments`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ productId: productId, quantity: 1 })
                        });
                        if (res.ok) await loadData();
                    } catch (err) {
                        console.error("Order creation error:", err);
                    }
                }

                async function dispatch(shipmentId) {
                    try {
                        const res = await fetch(`${API_BASE}/shipments/${shipmentId}/status`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ newStatus: 3 })
                        });
                        if (res.ok) await loadData();
                    } catch (err) {
                        console.error("Status update error:", err);
                    }
                }

                loadData();
    </script>
</body>
</html>
